version: 2


models:
  - name: stg_btc
    columns:
      - name: HASH_KEY
        tests:
          - unique
          - not_null

  - name: stg_btc_outputs
    tests:
      - dbt_utils.equal_rowcount:
            compare_model: ref('stg_btc_outputs_py')
  - name: whale_alert
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:
      - name: INVOCATION_ID
        data_type: string
      - name: output_address
        data_type: string
      - name: total_sent
        data_type: float
      - name: tx_count
        data_type: int
      - name: total_sent_usd
        data_type: float
        tests:
          - assert_valid_btc_address
 # Declare the versions, and highlight the diffs
    versions:
    
      - v: 1
        deprecation_date: 2026-01-01
        config:
          enabled: false
        # Matches what's above -- nothing more needed
    
      - v: 2
        # Removed a column -- this is the breaking change!
        columns:
          # This means: use the 'columns' list from above, but exclude country_name
          - include: all
            exclude: [total_sent_usd]          
exposures:

  - name: btc_whale_alert_exposure
    label: BTC whale alert
    type: dashboard
    maturity: high
    url: https://datastudio.google.com/reporting/017d6d59-86e0-4087-b792-23e576d56e18
    description: >
      Did someone say "BTC Whale alert transactions report"?

    depends_on:
      - ref('whale_alert', v=2)

    owner:
      name: Haris Bhat